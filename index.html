<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập từ vựng – Technology</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1c2233;--mu:#6b7385;--pr:#4f6bed;--prt:#fff;--bd:#dfe3ee;--ok:#1f9d61;--okb:#dff5ea;--bad:#d64545;--badb:#fbe3e3;--sh:0 2px 12px rgba(20,30,60,.08)}
:root[data-theme=dark]{--bg:#12141c;--card:#1c202c;--tx:#e8ebf5;--mu:#98a0b6;--pr:#7f95ff;--prt:#10131c;--bd:#2c3243;--ok:#4cd28e;--okb:#16362a;--bad:#ff7b7b;--badb:#3d1e22;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0;flex:1;min-width:140px}
.tabs{display:flex;gap:6px}
.tab,.btn,.ic{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}
.tab.on,.btn.pr{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.mu{color:var(--mu)}
.center{text-align:center}
.word{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;margin:6px 0}
.ipa{font-size:1.2rem;color:var(--pr)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mic{width:76px;height:76px;border-radius:50%;border:none;background:var(--pr);color:var(--prt);font-size:1.9rem;cursor:pointer}
.mic.rec{background:var(--bad);color:#fff;animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(214,69,69,.2)}}
.fb{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);min-height:48px}
.fb.ok{background:var(--okb)}.fb.bad{background:var(--badb)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--pr)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps div{flex:1;text-align:center;padding:8px 4px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-size:.85rem;color:var(--mu)}
.steps .on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;font-size:.92rem}
.it.sel{outline:3px solid var(--pr)}
.it.ok{background:var(--okb);border-color:var(--ok)}.it.bad{background:var(--badb);border-color:var(--bad)}
.num{min-width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;background:var(--mu)}
.q{padding:12px 0;border-bottom:1px solid var(--bd)}.q:last-child{border:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.op{font:inherit;color:var(--tx);text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.92rem}
.op.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,var(--card))}
.op.ok{background:var(--okb);border-color:var(--ok)}.op.bad{background:var(--badb);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:.88rem}
input.g{font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:3px 8px;width:min(260px,70vw)}
input.g.ok{border-color:var(--ok);background:var(--okb)}input.g.bad{border-color:var(--bad);background:var(--badb)}
.ans{color:var(--ok);font-weight:600;font-size:.9rem}
.act{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px;z-index:20}
.modal.on{display:grid}
.modal .card{max-width:440px;width:100%;margin:0}
.big{font-size:2.6rem;font-weight:800;color:var(--pr)}
@media(max-width:560px){.opts{grid-template-columns:1fr}main{padding:10px}.card{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>📘 Technology – Ôn từ vựng</h1>
  <div class="tabs"><button class="tab on" id="t1" onclick="setMode('speak')">🎤 Speaking</button><button class="tab" id="t2" onclick="setMode('read')">📖 Reading</button></div>
  <button class="ic" id="thm" onclick="toggleTheme()" aria-label="Đổi giao diện">🌙</button>
</header>
<main id="app"></main>
<div class="modal" id="modal"><div class="card center" id="sum"></div></div>

<script>

["access to information","/ˈækses tə ˌɪnfɚˈmeɪʃən/","sự tiếp cận thông tin","{} is easier than ever thanks to search engines."],
["work-life efficiency","/ˌwɜːrk ˈlaɪf ɪˈfɪʃənsi/","hiệu quả công việc & cuộc sống","Smart tools improve {} at home and at the office."],
["digital distraction","/ˈdɪdʒɪtəl dɪˈstrækʃən/","sự xao nhãng do thiết bị điện tử","Notifications are a major {} during study time."],
["healthy boundaries","/ˈhelθi ˈbaʊndəriz/","các ranh giới lành mạnh","Parents should set {} between study and entertainment."],
["online banking","/ˌɑːnˈlaɪn ˈbæŋkɪŋ/","dịch vụ ngân hàng trực tuyến","{} lets you transfer money without visiting a branch."],
["navigation tools","/ˌnævɪˈɡeɪʃən tuːlz/","các công cụ định vị","{} help drivers find the fastest route."],

const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[-–]/g," ").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- Theme ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;$("#thm").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("th",t)}catch(e){}}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")}
let saved=null;try{saved=localStorage.getItem("th")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));

/* ---------- Mode ---------- */
let mode="speak";
function setMode(m){mode=m;$("#t1").classList.toggle("on",m==="speak");$("#t2").classList.toggle("on",m==="read");stopRec();speechSynthesis.cancel();m==="speak"?renderSpeak():renderRead();scrollTo(0,0)}

/* ---------- SPEAKING ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let si=0,rec=null,listening=false,heard="",recErr="";
function speak(slow){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(W[si][0]);u.lang="en-US";u.rate=slow?.55:.9;const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function renderSpeak(){
  const w=W[si];
  app.innerHTML=`<div class="card center">
    <div class="mu">Từ ${si+1} / ${W.length}</div><div class="bar"><i style="width:${(si+1)/W.length*100}%"></i></div>
    <div class="word">${w[0]}</div><div class="ipa">${w[1]}</div><div class="mu" style="margin-top:6px">${esc(w[2])}</div>
    <div class="row"><button class="btn" onclick="speak(false)">🔊 Nghe mẫu</button><button class="btn" onclick="speak(true)">🐢 Nghe chậm</button></div>
    <div class="row"><button class="mic" id="mic" onclick="toggleMic()" aria-label="Micro">🎤</button></div>
    <div class="mu" id="hint" style="margin-top:6px;font-size:.9rem">Bấm micro để nói, bấm lần nữa để dừng và chấm điểm.</div>
    <div class="fb" id="fb">Nghe mẫu rồi bấm micro và đọc theo nhé.</div>
    <div class="row"><button class="btn" onclick="moveS(-1)" ${si?"":"disabled"}>← Từ trước</button><button class="btn pr" onclick="moveS(1)">Bỏ qua / Từ tiếp →</button></div>
  </div>`;
}
function moveS(d){stopRec();si=(si+d+W.length)%W.length;renderSpeak()}
function stopRec(){if(rec&&listening){rec.onend=null;try{rec.abort()}catch(e){}}listening=false}
function setFb(t,c){const f=$("#fb");if(f){f.className="fb "+(c||"");f.innerHTML=t}}
function toggleMic(){
  if(!SR){setFb("Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome, Edge hoặc Safari mới.","bad");return}
  if(listening){rec.stop();return}
  speechSynthesis.cancel();heard="";recErr="";
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;
  rec.onresult=e=>{heard="";for(let i=0;i<e.results.length;i++)heard+=e.results[i][0].transcript+" ";setFb("🎧 Đang nghe: <i>"+esc(heard)+"</i>")};
  rec.onerror=e=>{recErr=e.error};
  rec.onend=()=>{listening=false;const m=$("#mic");if(m)m.classList.remove("rec");evaluate()};
  try{rec.start();listening=true;$("#mic").classList.add("rec");setFb("🎧 Đang nghe... đọc xong thì bấm micro lần nữa.")}catch(e){setFb("Không mở được micro, hãy thử lại.","bad")}
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function evaluate(){
  if(recErr==="not-allowed"||recErr==="service-not-allowed"){setFb("Trình duyệt chưa cho phép dùng micro. Hãy cấp quyền micro cho trang web rồi thử lại.","bad");return}
  if(!heard.trim()){setFb("Mình chưa nghe thấy giọng bạn. Hãy kiểm tra micro và thử nói lại nhé.","bad");return}
  const tw=norm(W[si][0]).split(" "),hw=norm(heard).split(" ");
  const miss=tw.filter(t=>!hw.some(h=>sim(t,h)>=.72));
  const ratio=(tw.length-miss.length)/tw.length;
  if(ratio>=.75)setFb(`✅ <b>Phát âm khá ổn!</b> Mình nghe được: <i>"${esc(heard.trim())}"</i>. Bạn có thể sang từ tiếp theo hoặc thử lại để hoàn thiện hơn.`,"ok");
  else setFb(`⚠️ <b>Chưa ổn lắm.</b> Mình nghe được: <i>"${esc(heard.trim())}"</i>.<br>Các từ chưa rõ: <b>${miss.join(", ")}</b>. Hãy nghe lại mẫu, chú ý IPA và nhấn âm rồi bấm micro nói lại, hoặc bỏ qua để sang từ mới.`,"bad");
}

/* ---------- READING ---------- */
let queue=[],qp=0,R=null;
function take(n){const o=[];while(o.length<n){if(qp>=queue.length){queue=sh(W.map((_,i)=>i));qp=0}const i=queue[qp++];if(!o.includes(i))o.push(i)}return o}
const COL=["#e6550d","#3182bd","#31a354","#756bb1","#d6616b","#b8860b","#17a2b8","#8c564b","#e377c2","#637939"];
function newRound(){
  const m=take(10);
  R={step:0,sc:[0,0,0],done:[false,false,false],
    mt:{L:sh(m),Rt:sh(m),pairs:{},sel:null},
    q:take(20).map(i=>({i,opts:sh([i,...sh(W.map((_,k)=>k).filter(k=>k!==i)).slice(0,3)]),pick:null})),
    g:take(20).map(i=>({i,val:""}))};
}
const STEPS=["1 · Matching","2 · Multiple choice","3 · Gap filling"];
function renderRead(){
  if(!R)newRound();
  let h=`<div class="steps">${STEPS.map((s,i)=>`<div class="${i===R.step?"on":""}">${s}</div>`).join("")}</div>`;
  h+=[rMatch,rMcq,rGap][R.step]();
  const d=R.done[R.step],total=R.step===0?10:20;
  h+=`<div class="act"><div>${d?`<b>Kết quả: ${R.sc[R.step]} / ${total}</b>`:`<span class="mu">${R.step===2?"Điền xong thì bấm kiểm tra":"Hoàn thành rồi bấm kiểm tra"}</span>`}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="restart()">🔄 Làm lại</button>
   ${d?"":`<button class="btn pr" onclick="check()">✔ Kiểm tra</button>`}
   ${d&&R.step<2?`<button class="btn pr" onclick="R.step++;renderRead();scrollTo(0,0)">Phần tiếp theo →</button>`:""}
   ${d&&R.step===2?`<button class="btn pr" onclick="showSum()">📊 Xem tổng kết</button>`:""}</div></div>`;
  app.innerHTML=h;
}
/* Matching */
function rMatch(){
  const M=R.mt,d=R.done[0],pos=wi=>M.L.indexOf(wi);
  const rp=vi=>{const l=Object.keys(M.pairs).find(k=>M.pairs[k]===vi);return l===undefined?-1:pos(+l)};
  return `<div class="card"><b>Nối từ tiếng Anh (cột trái) với nghĩa tiếng Việt (cột phải).</b><div class="mu" style="font-size:.9rem;margin-bottom:10px">Chạm một từ bên trái, rồi chạm nghĩa tương ứng bên phải. Chạm lại để đổi.</div><div class="cols"><div>
  ${M.L.map((wi,p)=>{const pr=M.pairs[wi],c=d?(pr===wi?"ok":"bad"):(M.sel===wi?"sel":"");return `<button class="it ${c}" onclick="mL(${wi})"><span class="num" style="background:${COL[p]}">${p+1}</span>${W[wi][0]}</button>`}).join("")}</div><div>
  ${M.Rt.map(wi=>{const p=rp(wi),c=d?(p>=0&&M.L[p]===wi?"ok":"bad"):"";return `<button class="it ${c}" style="${p>=0&&!d?"border-color:"+COL[p]:""}" onclick="mR(${wi})">${p>=0?`<span class="num" style="background:${COL[p]}">${p+1}</span>`:`<span class="num" style="background:var(--bd)">·</span>`}${esc(W[wi][2])}</button>`}).join("")}</div></div>
  ${d?`<div class="mu" style="margin-top:6px">Đáp án đúng:</div>${M.L.map((wi,p)=>`<div class="ans">${p+1}. ${W[wi][0]} → ${esc(W[wi][2])}</div>`).join("")}`:""}</div>`;
}
function mL(wi){if(R.done[0])return;R.mt.sel=R.mt.sel===wi?null:wi;renderRead()}
function mR(wi){if(R.done[0])return;const M=R.mt;const ex=Object.keys(M.pairs).find(k=>M.pairs[k]===wi);
  if(M.sel===null){if(ex!==undefined)delete M.pairs[ex]}else{if(ex!==undefined)delete M.pairs[ex];M.pairs[M.sel]=wi;M.sel=null}renderRead()}
/* MCQ */
function rMcq(){
  const d=R.done[1];
  return `<div class="card"><b>Chọn từ/cụm từ phù hợp nhất để điền vào chỗ trống.</b>${R.q.map((q,k)=>`<div class="q"><div>${k+1}. ${esc(W[q.i][3]).replace("{}","<b>_____</b>")}</div><div class="opts">${q.opts.map(o=>{let c=q.pick===o?"sel":"";if(d){if(o===q.i)c="ok";else if(q.pick===o)c="bad"}return `<button class="op ${c}" onclick="pick(${k},${o})">${W[o][0]}</button>`}).join("")}</div>${d&&q.pick!==q.i?`<div class="ans" style="margin-top:6px">Đáp án đúng: ${W[q.i][0]}</div>`:""}</div>`).join("")}</div>`;
}
function pick(k,o){if(R.done[1])return;R.q[k].pick=o;renderRead()}
/* Gap */
function rGap(){
  const d=R.done[2],bank=R.bank=R.bank||sh(R.g.map(x=>W[x.i][0]));
  return `<div class="card"><b>Từ cần điền (đã xáo trộn):</b><div class="bank" style="margin-top:8px">${bank.map(b=>`<span class="chip">${b}</span>`).join("")}</div></div>
  <div class="card"><b>Gõ từ/cụm từ thích hợp vào chỗ trống.</b>${R.g.map((x,k)=>{const ok=norm(x.val)===norm(W[x.i][0]);const [a,b]=esc(W[x.i][3]).split("{}");
   return `<div class="q">${k+1}. ${a}<input class="g ${d?(ok?"ok":"bad"):""}" value="${esc(x.val).replace(/"/g,"&quot;")}" ${d?"disabled":""} oninput="R.g[${k}].val=this.value" autocomplete="off" autocapitalize="off" spellcheck="false">${b}${d&&!ok?`<div class="ans">Đáp án: ${W[x.i][0]}</div>`:""}</div>`}).join("")}</div>`;
}
function check(){
  const s=R.step;
  if(s===0)R.sc[0]=R.mt.L.filter(wi=>R.mt.pairs[wi]===wi).length;
  if(s===1)R.sc[1]=R.q.filter(q=>q.pick===q.i).length;
  if(s===2)R.sc[2]=R.g.filter(x=>norm(x.val)===norm(W[x.i][0])).length;
  R.done[s]=true;renderRead();
  if(s===2)scrollTo(0,0);
}
function restart(){if(confirm("Làm lại với bộ từ vựng và câu hỏi mới?")){newRound();$("#modal").classList.remove("on");renderRead();scrollTo(0,0)}}
function showSum(){
  const t=R.sc[0]+R.sc[1]+R.sc[2],p=t/50;
  const nm=["Matching","Multiple choice","Gap filling"],mx=[10,20,20];
  const weak=R.sc.map((s,i)=>s/mx[i]).reduce((a,v,i,arr)=>v<arr[a]?i:a,0);
  const adv=p>=.9?"Xuất sắc! Bạn nắm rất chắc bộ từ vựng này. Hãy thử làm lại để gặp thêm từ mới và luyện phần Speaking.":
   p>=.7?`Khá tốt! Hãy ôn lại các từ đã sai và luyện thêm phần ${nm[weak]} (điểm thấp nhất của bạn).`:
   p>=.5?`Bạn nắm được một nửa bộ từ. Nên đọc lại danh sách từ, luyện Speaking để nhớ mặt chữ, và chú ý phần ${nm[weak]}.`:
   "Bạn cần ôn thêm. Hãy học từng nhóm nhỏ 10 từ, luyện phần Speaking để ghi nhớ nghĩa và cách viết, rồi làm lại bài.";
  $("#sum").innerHTML=`<h2 style="margin-top:0">📊 Tổng kết</h2><div class="big">${t} / 50</div>
   <p class="mu">Matching ${R.sc[0]}/10 · Multiple choice ${R.sc[1]}/20 · Gap filling ${R.sc[2]}/20</p><p>${adv}</p>
   <div class="row"><button class="btn" onclick="$('#modal').classList.remove('on')">Đóng</button><button class="btn pr" onclick="restart2()">🔄 Làm lại</button></div>`;
  $("#modal").classList.add("on");
}
function restart2(){newRound();$("#modal").classList.remove("on");renderRead();scrollTo(0,0)}
speechSynthesis.onvoiceschanged=()=>{};
renderSpeak();
</script>
